<h1 class="main-title">Robin's Box</h1>

<style>
/* --- Custom Font Declarations --- */
@font-face {
  font-family: 'Velmora Signature';
  src: url('Velmora Signature.otf') format('opentype');

  font-style: normal;
}

@font-face {

/* --- Core Layout Styling --- */
.scene{display:flex;flex-direction:column;align-items:center;min-height:720px;gap:10px;padding:2rem;overflow:hidden;position:relative;}

/* Robin's Box Main Title Styling */

  font-family: 'Velmora Signature', cursive, sans-serif;

  text-align: center;

/* Sub-hint for instructions */

  text-align: center;
  margin-bottom: 20px;
}

.col{display:flex;flex-direction:column;align-items:center;gap:24px;transition:transform 0.52s cubic-bezier(0.4,0,0.2,1),opacity 0.42s ease;will-change:transform;}

.gift-region{position:relative;width:192px;height:384px;flex-shrink:0;}
.gift-wrap{position:absolute;inset:0;}

.spr{position:absolute;width:192px;height:192px;image-rendering:pixelated;

.lid{top:192px;left:0;z-index:4;cursor:pointer;

.paper{position:absolute;top:192px;left:0;width:192px;height:192px;z-index:2;

.paper.vis{opacity:1;pointer-events:auto;transform: translateY(-138px) scale(1);}

/* Confetti Particle Styling */
.confetti {
  position: absolute;
  top: 260px; 
  left: 88px; 
  width: 16px; 
  height: 8px; 
  background-size: 100% 100%;
  background-repeat: no-repeat;
  image-rendering: pixelated;
  pointer-events: none;
  z-index: 5;
}

/* Star Particle Styling */
.star {
  position: absolute;
  top: 260px;
  left: 84px; 
  width: 24px; 
  height: 24px; 
  background-size: 100% 100%;
  background-repeat: no-repeat;
  image-rendering: pixelated;
  pointer-events: none;
  z-index: 5;
}

/* Horizontal Layout for the 5 Spawned Papers */
.papers-row {
  display: none;
  position: absolute;
  top: 54px; 
  left: 50%;
  transform: translateX(-50%);
  flex-direction: row;
  justify-content: center;
  align-items: center;
  gap: 16px;
  z-index: 6;
  white-space: nowrap;
}

.spawned-paper {
  width: 192px;  
  height: 192px; 
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  cursor: pointer;
  image-rendering: pixelated;
  will-change: transform, opacity;
}

/* Subtle nervous jitter */
.spawned-paper:hover:not(.expanded) {
  animation: nervousShake 0.15s infinite alternate ease-in-out;
}

@keyframes nervousShake {
  0% { transform: translate(0.5px, 0.5px) rotate(0.4deg); }
  50% { transform: translate(-0.5px, -0.5px) rotate(-0.4deg); }
  100% { transform: translate(0.5px, -0.5px) rotate(0.2deg); }
}

/* Expanded selection state */
.spawned-paper.expanded {
  transform: scale(1.15) !important; 
  filter: drop-shadow(0px 6px 12px rgba(0,0,0,0.2));
  z-index: 10;
}

.msg-card{display:none;width:340px;background:var(--color-background-primary, #ffffff);

// --- BULLETPROOF TIMER LOGIC ---
// Using integers (Year, Month Index 0-11, Day). Month 3 = April.
// This is 100% immune to all iOS and Safari date parsing bugs.
const startDate = new Date(2023, 3, 19, 0, 0, 0).getTime();

function updateCounter() {
  try {
    const counterEl = document.getElementById("counterText");
    if (!counterEl) return; 

    const now = new Date().getTime();
    const diff = now - startDate;

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    counterEl.innerHTML = `${days} days<br>${hours} hours, ${minutes} minutes, ${seconds} seconds`;
  } catch(error) {
    console.error("Timer failed:", error);
  }
}

// Call instantly since the script is at the bottom of the HTML
setInterval(updateCounter, 1000);
updateCounter();

let state = 'closed';
let preRolledPapers = []; 

function shootConfetti(hasLegendaryUp) {
  try {
    const region = document.querySelector('.gift-region');
    const colors = ['ConfettiRed.png', 'ConfettiGreen.png', 'ConfettiBlue.png', 'ConfettiYellow.png'];
    
    const regularCount = 45;
    for (let i = 0; i < regularCount; i++) {
      createParticle(region, colors[Math.floor(Math.random() * colors.length)], 'confetti');
    }

    if (hasLegendaryUp) {
      const starCount = 60; 
      for (let i = 0; i < starCount; i++) {
        createParticle(region, 'Star.png', 'star');
      }
    }
  } catch(e) { console.error("Confetti error:", e); }
}

function createParticle(parentRegion, spriteName, className) {
  const p = document.createElement('div');
  p.className = className;
  p.style.backgroundImage = `url('${spriteName}')`;
  parentRegion.appendChild(p);

  const duration = 1.6 + Math.random() * 0.7; 
  const fps = 30; 
  const totalFrames = Math.floor(duration * fps);
  
  const vx = (Math.random() - 0.5) * 360; 
  const vy = -(Math.random() * 300 + 320); 
  const gravity = 850; 
  const rotSpeed = (Math.random() - 0.5) * 550; 

  const keyframes = [];
  for (let f = 0; f <= totalFrames; f++) {
    const t = f / fps;
    const dx = vx * t;
    const dy = (vy * t) + (0.5 * gravity * t * t);
    const rZ = rotSpeed * t;
    const opacityFade = t > (duration - 0.4) ? 1 - ((t - (duration - 0.4)) * 2.5) : 1;

    keyframes.push({
      transform: `translate(${dx}px, ${dy}px) rotate(${rZ}deg)`,
      opacity: Math.max(0, opacityFade)
    });
  }

  p.animate(keyframes, {
    duration: duration * 1000,
    easing: 'linear',
    fill: 'forwards'
  });

  setTimeout(() => p.remove(), duration * 1000);
}

function openLid() {
  try {
    if (state !== 'closed') return;
    state = 'open';
    const lid = document.getElementById('lid');
    
    const direction = Math.random() < 0.5 ? -1 : 1;
    const randomAngle = direction * (15 + Math.random() * 20);
    
    lid.style.transform = `translateY(800px) rotate(${randomAngle}deg)`;
    
    preRolledPapers = [];
    let hasLegendaryUp = false;

    for (let i = 0; i < 5; i++) {
      const roll = Math.random() * 100;
      let tier = "Common";
      
      if (roll < 0.0001) tier = "One of a kind";
      else if (roll < 0.0101) tier = "Exotic";
      else if (roll < 1.0101) tier = "Legendary";
      else if (roll < 6.0101) tier = "Epic";
      else if (roll < 21.0101) tier = "Rare";
      else if (roll < 61.0101) tier = "Uncommon";
      else tier = "Common";

      if (tier === "Legendary" || tier === "Exotic" || tier === "One of a kind") {
        hasLegendaryUp = true;
      }

      const pool = rarityData[tier].messages;
      const chosenMessage = pool[Math.floor(Math.random() * pool.length)];
      
      preRolledPapers.push({ tier: tier, message: chosenMessage });
    }

    shootConfetti(hasLegendaryUp); 
    
    setTimeout(() => {
      document.getElementById('paper').classList.add('vis');
      document.getElementById('hint').textContent = 'now click the paper!';
    }, 200);
  } catch(e) { console.error("Box error:", e); }
}

function openPaper() {
  if (state !== 'open') return;
  state = 'read';
  
  const paper = document.getElementById('paper');
  paper.style.transform = 'scale(0)';
  paper.style.opacity = '0';
  paper.style.pointerEvents = 'none';

  const papersRow = document.getElementById('papersRow');
  papersRow.innerHTML = ''; 
  papersRow.style.display = 'flex';

  const paperWidth = 192;
  const gapSize = 16;
  const spawnedPapers = [];

  for (let i = 0; i < 5; i++) {
    const rolledItem = preRolledPapers[i];
    const tier = rolledItem.tier;

    const pEl = document.createElement('div');
    pEl.className = 'spawned-paper';
    pEl.style.backgroundImage = `url('${rarityData[tier].image}')`;
    
    const finalOffsetFromCenter = (i - 2) * (paperWidth + gapSize);
    pEl.style.transform = `translateX(${-finalOffsetFromCenter}px) scale(0.2)`;
    pEl.style.opacity = '0';
    pEl.style.transition = 'transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease';
    
    pEl.dataset.savedMessage = rolledItem.message; 
    pEl.dataset.savedTier = tier; 

    pEl.onclick = function() {
      if (pEl.classList.contains('expanded')) return;

      document.querySelectorAll('.spawned-paper').forEach(el => el.classList.remove('expanded'));
      pEl.classList.add('expanded');

      const tierName = pEl.dataset.savedTier;
      
      const label = document.getElementById('rarityLabel'); 
      label.textContent = `• ${tierName} •`;
      label.style.color = rarityData[tierName].color;
      document.getElementById('msgText').textContent = pEl.dataset.savedMessage;

      const card = document.getElementById('msgCard');
      card.style.display = 'block';
      requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('vis')));
    };

    papersRow.appendChild(pEl);
    spawnedPapers.push(pEl);
  }

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      spawnedPapers.forEach(p => {
        p.style.transform = 'translateX(0) scale(1)';
        p.style.opacity = '1';
      });
    });
  });

  document.getElementById('hint').textContent = 'pick a paper to read its secrets!';
  
  const btn = document.getElementById('resetBtn');
  btn.style.display = 'inline-block';
  setTimeout(() => btn.classList.add('vis'), 50);
}

function resetGift() {
  const col = document.getElementById('col');
  col.style.transform = 'translateX(-620px)';
  col.style.opacity = '0';

  setTimeout(() => {
    col.style.transition = 'none';
    col.style.transform = 'translateX(620px)';
    col.style.opacity = '0';
    state = 'closed';
    preRolledPapers = [];

    const lid = document.getElementById('lid');
    lid.style.transform = '';

    const paper = document.getElementById('paper');
    paper.style.transform = '';
    paper.style.opacity = '';
    paper.style.pointerEvents = ''; 
    paper.classList.remove('vis');

    const papersRow = document.getElementById('papersRow');
    papersRow.style.display = 'none';
    papersRow.innerHTML = '';

    const card = document.getElementById('msgCard');
    card.classList.remove('vis');
    card.style.display = 'none';

    const btn = document.getElementById('resetBtn');
    btn.classList.remove('vis');
    btn.style.display = 'none';

    document.getElementById('hint').textContent = 'click the gift to open it';

    requestAnimationFrame(() => requestAnimationFrame(() => {
      col.style.transition = '';
      col.style.opacity = '1';
      col.style.transform = '';
    }));
  }, 540);
}
</script>
